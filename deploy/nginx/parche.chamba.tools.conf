# nginx virtual-host for parche.chamba.tools
# ──────────────────────────────────────────
# Installation on the VPS:
#
#   sudo cp deploy/nginx/parche.chamba.tools.conf \
#             /etc/nginx/sites-available/parche.chamba.tools.conf
#   sudo ln -s /etc/nginx/sites-available/parche.chamba.tools.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx   # ALWAYS test before reload
#
# TLS — certbot rewrites this file (adds a 443 server block and a redirect):
#
#   sudo certbot --nginx -d parche.chamba.tools
#
# After certbot, HSTS in the :443 block protects against downgrade attacks.
# The add_header below is in :80; browsers ignore HSTS over plain HTTP,
# so it is harmless pre-TLS and effective once certbot moves it to 443.
# If you deploy without TLS, remove the Strict-Transport-Security line.

server {
    listen 80;
    listen [::]:80;
    server_name parche.chamba.tools;

    # Allow blobs up to 20 MiB — matches PARCHE_MAX_BLOB_BYTES default
    client_max_body_size 20m;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # Pass the original Host header so the app can build absolute URLs if needed
        proxy_set_header Host              $host;
        # Pass client IP to the app (used by rate limiting via PARCHE_TRUST_PROXY)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do NOT buffer request bodies — required for streaming blob uploads
        proxy_request_buffering off;
    }

    # Security headers
    # HSTS: certbot moves this to the 443 block; see comment at top of file.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                               always;
}
